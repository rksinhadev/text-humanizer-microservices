services:
  db:
    image: mysql:8.0
    container_name: text_humanizer_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: text_humanizer
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  app:
    image: jeeshanadil/text-humanizer:latest
    container_name: text_humanizer_app
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: text_humanizer
      JWT_SECRET: your_jwt_secret_key_12345
    ports:
      - "8080:5000"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  mysql_data:
