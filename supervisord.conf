[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:auth_service]
command=python auth_service.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/auth_service.log
stderr_logfile=/var/log/auth_service_err.log

[program:history_service]
command=python history_service.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/history_service.log
stderr_logfile=/var/log/history_service_err.log

[program:ai_service]
command=python ai_service.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/ai_service.log
stderr_logfile=/var/log/ai_service_err.log

[program:gateway]
command=python gateway.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/gateway.log
stderr_logfile=/var/log/gateway_err.log
